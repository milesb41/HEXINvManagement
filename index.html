<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEX INv Management</title>
    <link rel="stylesheet" href="index.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
</head>
<body>

    <div class="login-container">
        <h2>HEX INv Management</h2>
        <form id="loginForm">
            <div class="input-group">
                <label for="userid">USERID</label>
                <!-- Changed back to type="text" -->
                <input type="text" id="userid" name="userid" required placeholder="Enter your USERID">
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>

            <button type="submit" class="login-btn">Log In</button>
            <p id="errorMessage" style="color: red; display: none; margin-top: 10px; font-size: 14px;"></p>
        </form>
    </div>

    <!-- Load your Firebase config -->
    <script src="firebase-config.js"></script>

    <script>
        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                window.location.href = "managementtool.html";
            }
        });

        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault(); 
            
            const userid = document.getElementById('userid').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMessage');

            // Secretly append the dummy domain to the ID
            const formattedEmail = userid + "@hexinvmanagement.com";

            firebase.auth().signInWithEmailAndPassword(formattedEmail, password)
                .then((userCredential) => {
                    window.location.href = "managementtool.html"; 
                })
                .catch((error) => {
                    errorMsg.textContent = "Invalid login credentials. Please try again.";
                    errorMsg.style.display = "block";
                    console.error(error.code, error.message);
                });
        });
    </script>

</body>
</html>
